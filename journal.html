<article class="jr-entry in">
      <div class="jr-date">August 2026</div>
      <h2>Launched abhishekindia.com</h2>
      <div class="jr-tags"><span class="jr-tag">site</span><span class="jr-tag">meta</span></div>
      <p>Finally gave my projects a proper home. Built this site as a single place to show what I'm building — hyperlocal, utility tools, trading experiments — instead of it all being scattered. Static, fast, and easy to update. This journal is where I'll log what I ship next.</p>

<article class="jr-entry in">

      <div class="jr-tags"><span class="jr-tag">trading</span><span class="jr-tag">tools</span></div>

<script>
(function(){
  var JOURNAL_URL = "https://script.google.com/macros/s/AKfycbxmuKijYyvmVPDx6i-9EIBlCArDtZRZL7IlgoYnSJ5ppGmGEZRUeKUgPTtFijxlrdJ8Og/exec";
  var box = document.getElementById("jrList");
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function render(list){
    if(!list.length){ box.innerHTML = '<p class="jr-status">No entries yet.</p>'; return; }
    box.innerHTML = list.map(function(e){
      var tags = (e.tags && e.tags.length)
        ? '<div class="jr-tags">' + e.tags.map(function(t){return '<span class="jr-tag">'+esc(t)+'</span>';}).join("") + '</div>'
        : '';
      return '<article class="jr-entry in">'
           +   '<div class="jr-date">'+esc(e.date)+'</div>'
           +   '<h2>'+esc(e.title)+'</h2>'
           +   tags
           +   '<p>'+esc(e.body)+'</p>'
           + '</article>';
    }).join("");
  }
  function useFallback(){
    var tpl = document.getElementById("jrFallback");
    box.innerHTML = tpl ? tpl.innerHTML : '<p class="jr-status">Couldn\u2019t load the journal right now.</p>';
  }
  fetch(JOURNAL_URL)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(list){ render(Array.isArray(list)?list:[]); })
    .catch(function(err){ console.error("journal load failed:", err); useFallback(); });
})();
</script>

<script>
function initReveal(){
  var els=document.querySelectorAll(".reveal:not(.in)");
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);}});},{threshold:.12});
  els.forEach(function(e){io.observe(e);});
}
initReveal();
var burger=document.getElementById("burger"),links=document.getElementById("navLinks");
if(burger){burger.addEventListener("click",function(){links.classList.toggle("open");});
links.addEventListener("click",function(e){if(e.target.tagName==="A")links.classList.remove("open");});}
var yr=document.getElementById("yr");if(yr)yr.textContent=new Date().getFullYear();
var tg=document.getElementById("themeToggle");
function setThemeIcon(){var d=document.documentElement.getAttribute("data-theme")==="dark";if(tg)tg.textContent=d?"☀️":"🌙";}
setThemeIcon();
if(tg)tg.addEventListener("click",function(){var d=document.documentElement.getAttribute("data-theme")==="dark";var n=d?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("theme",n);}catch(e){}setThemeIcon();});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/service-worker.js").catch(function(){});});}
(function(){
  var deferredPrompt=null, installBtn=document.getElementById("installBtn"), shown=false;
  var isStandalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  var ua=navigator.userAgent||"", isIOS=/iphone|ipad|ipod/i.test(ua)&&!window.MSStream;
  var dismissed=false; try{dismissed=localStorage.getItem("pwa_dismissed")==="1";}catch(e){}
  function remember(){try{localStorage.setItem("pwa_dismissed","1");}catch(e){}}
  function triggerInstall(){ if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null;hideModal();});} }
  function hideModal(){var m=document.getElementById("pwaModal");if(m)m.classList.remove("show");}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;if(installBtn)installBtn.hidden=false;if(shown){var old=document.getElementById("pwaModal");if(old)old.remove();shown=false;showModal();}});
  window.addEventListener("appinstalled",function(){if(installBtn)installBtn.hidden=true;hideModal();remember();});
  if(installBtn)installBtn.addEventListener("click",triggerInstall);
  function showModal(){
    if(shown||isStandalone||dismissed)return; shown=true;
    var mode=deferredPrompt?"prompt":(isIOS?"ios":"manual");
    var sub=mode==="ios"?"Tap the Share icon, then choose \u201CAdd to Home Screen\u201D."
          :mode==="manual"?"Open your browser menu and choose \u201CInstall app\u201D to add it to your device."
          :"Add AbhishekIndia to your home screen for quick, full-screen access — even offline.";
    var btn=mode==="prompt"?'<button class="pwa-go" id="pwaGo">Install app</button>':"";
    var m=document.createElement("div"); m.id="pwaModal"; m.className="pwa-modal";
    m.innerHTML='<div class="pwa-card" role="dialog" aria-modal="true" aria-label="Install AbhishekIndia">'
      +'<button class="pwa-x" id="pwaX" aria-label="Close">\u00D7</button>'
      +'<img src="img/logo-mark.webp" alt="" class="pwa-ico">'
      +'<h3>Install AbhishekIndia</h3>'
      +'<p>'+sub+'</p>'+btn
      +'<button class="pwa-later" id="pwaLater">Maybe later</button>'
      +'</div>';
    document.body.appendChild(m); requestAnimationFrame(function(){m.classList.add("show");});
    var go=document.getElementById("pwaGo"); if(go)go.addEventListener("click",triggerInstall);
    document.getElementById("pwaX").addEventListener("click",function(){hideModal();remember();});
    document.getElementById("pwaLater").addEventListener("click",function(){hideModal();remember();});
    m.addEventListener("click",function(ev){if(ev.target===m){hideModal();remember();}});
  }
  setTimeout(showModal,5000);
})();
</script>
